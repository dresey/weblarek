<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <title>Web-Ларёк</title>
  </head>
  <body class="page">
    <div class="page__wrapper">
      <header class="header">
        <div class="header__container">
          <a class="header__logo" href="/" aria-label="Главная страница Web-Ларька">
            <img class="header__logo-image" src="./src/images/logo.svg" alt="Web-Larek! logo" />
          </a>
          <button type="button" class="header__basket" aria-label="Открыть корзину" aria-haspopup="dialog">
            <span class="header__basket-counter">0</span>
          </button>
        </div>
      </header>

      <main class="gallery" aria-label="Каталог товаров"></main>
    </div>

    <section class="modal" id="modal-container" role="dialog" aria-modal="true" aria-label="Окно магазина">
      <div class="modal__container">
        <button type="button" class="modal__close" aria-label="Закрыть окно"></button>
        <div class="modal__content"></div>
      </div>
    </section>

    <template id="success">
      <div class="order-success">
        <h2 class="order-success__title">Заказ оформлен</h2>
        <p class="order-success__description">Списано 0 синапсов</p>
        <button type="button" class="button order-success__close">За новыми покупками!</button>
      </div>
    </template>

    <template id="card-catalog">
      <button type="button" class="gallery__item card">
        <span class="card__category card__category_soft">софт-скил</span>
        <h2 class="card__title">+1 час в сутках</h2>
        <img class="card__image" src="./src/images/Subtract.svg" alt="" />
        <span class="card__price">750 синапсов</span>
      </button>
    </template>

    <template id="card-preview">
      <article class="card card_full">
        <img class="card__image" src="./src/images/Subtract.svg" alt="" />
        <div class="card__column">
          <span class="card__category card__category_other">другое</span>
          <h2 class="card__title">Бэкенд-антистресс</h2>
          <p class="card__text">Если планируете решать задачи в тренажёре, берите два.</p>
          <div class="card__row">
            <button type="button" class="button card__button">В корзину</button>
            <span class="card__price">1000 синапсов</span>
          </div>
        </div>
      </article>
    </template>

    <template id="card-basket">
      <li class="basket__item card card_compact">
        <span class="basket__item-index">1</span>
        <span class="card__title">Фреймворк куки судьбы</span>
        <span class="card__price">2500 синапсов</span>
        <button type="button" class="basket__item-delete card__button" aria-label="Удалить товар"></button>
      </li>
    </template>

    <template id="basket">
      <section class="basket" aria-labelledby="basket-title">
        <h2 class="modal__title" id="basket-title">Корзина</h2>
        <ul class="basket__list"></ul>
        <div class="modal__actions">
          <button type="button" class="button basket__button">Оформить</button>
          <span class="basket__price">0 синапсов</span>
        </div>
      </section>
    </template>

    <template id="order">
      <form class="form" name="order">
        <div class="order">
          <div class="order__field">
            <h2 class="modal__title">Способ оплаты</h2>
            <div class="order__buttons">
              <button name="card" type="button" class="button button_alt">Онлайн</button>
              <button name="cash" type="button" class="button button_alt">При получении</button>
            </div>
          </div>
          <label class="order__field">
            <span class="form__label modal__title">Адрес доставки</span>
            <input name="address" class="form__input" type="text" autocomplete="street-address" placeholder="Введите адрес" />
          </label>
        </div>
        <div class="modal__actions">
          <button type="submit" disabled class="button order__button">Далее</button>
          <span class="form__errors" aria-live="polite"></span>
        </div>
      </form>
    </template>

    <template id="contacts">
      <form class="form" name="contacts">
        <div class="order">
          <label class="order__field">
            <span class="form__label modal__title">Email</span>
            <input name="email" class="form__input" type="email" autocomplete="email" placeholder="Введите email" />
          </label>
          <label class="order__field">
            <span class="form__label modal__title">Телефон</span>
            <input name="phone" class="form__input" type="tel" autocomplete="tel" placeholder="+7 (" />
          </label>
        </div>
        <div class="modal__actions">
          <button type="submit" disabled class="button">Оплатить</button>
          <span class="form__errors" aria-live="polite"></span>
        </div>
      </form>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
